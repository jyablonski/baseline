repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^docker-compose\.prod\.yml$
      - id: check-toml
      - id: debug-statements
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        types_or: [javascript, jsx, ts, tsx, css, json, markdown, yaml]
        exclude: ^(package-lock\.json|.*uv\.lock|htmlcov/|.*coverage/)
        entry: node services/frontend/node_modules/prettier/bin/prettier.cjs --write
        pass_filenames: true
      # See scripts/ty-check.sh: per-service invocation, and it resolves uv even
      # when a GUI git client commits with a minimal PATH.
      - id: ty
        name: ty
        language: system
        pass_filenames: false
        files: ^(services/(api|scraper|mcp|cube|ml|migrate)|lib)/.*\.py$
        entry: scripts/ty-check.sh
      # See scripts/dbt-score.sh: dbt parse (no database) then dbt-score lint.
      - id: dbt-score
        name: dbt-score
        language: system
        pass_filenames: false
        files: ^services/dbt/((models|seeds|macros|tests|dbt_score_rules)/|dbt_project\.yml$|pyproject\.toml$|packages\.yml$)
        entry: scripts/dbt-score.sh
      - id: frontend-eslint
        name: frontend eslint
        language: system
        pass_filenames: false
        files: ^services/frontend/.*\.(js|jsx|ts|tsx)$
        entry: bash -c 'cd services/frontend && npx eslint --max-warnings=0 .'
      # `next build` type-checks with tsconfig.build.json, which only excludes
      # tests — so a clean tsconfig.json (the superset) guarantees the image
      # build type-checks too. Neither eslint nor vitest runs tsc.
      - id: frontend-tsc
        name: frontend tsc
        language: system
        pass_filenames: false
        files: ^services/frontend/.*\.(ts|tsx)$
        entry: bash -c 'cd services/frontend && npm run --silent typecheck'
