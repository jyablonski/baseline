# Production overlay for docker-compose.yml. Do not start scraper / dbt / ml / cron.
# IMAGE_PREFIX/IMAGE_TAG select prebuilt registry images; unset means the local
# `nba-*:latest` this box built. Set PUBLIC_URL to move off baseline.jyablonski.dev
# (the Caddyfile hardcodes the same host separately — ACME needs it there).
# Cube and MCP run on the production Compose network and are not published to the host; Caddy serves MCP at /mcp over TLS. Postgres is intentionally published for direct DBeaver access.
# Usage: DOCKER_TARGET=runtime docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d postgres api frontend mcp cube caddy
# `ports: !reset []` (not a bare `[]`) is required so Compose drops the base file's published ports.
services:
  postgres:
    # Bind on all host interfaces so DBeaver can connect through the Oracle public IP.
    # Override POSTGRES_PORT in the server .env to use a different external port.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    mem_limit: 2g
    command:
      - postgres
      - -c
      - shared_buffers=256MB

  migrate:
    image: ${IMAGE_PREFIX:-}nba-migrate:${IMAGE_TAG:-latest}

  api:
    image: ${IMAGE_PREFIX:-}nba-api:${IMAGE_TAG:-latest}
    ports: !reset []
    mem_limit: 512m

  frontend:
    image: ${IMAGE_PREFIX:-}nba-frontend:${IMAGE_TAG:-latest}
    ports: !reset []
    mem_limit: 512m
    build:
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-https://baseline.jyablonski.dev}
        NEXT_PUBLIC_GIT_SHA: ${GIT_SHA:-dev}
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-https://baseline.jyablonski.dev}
      # Only prod has a runner draining source.admin_jobs (cron -> prod-admin-jobs).
      ADMIN_JOBS_ENABLED: "true"

  # Base compose bind-mounts host code for local `compose run`. Runtime
  # images must stay baked; `!reset` (not a bare `[]`) drops the merge.
  scraper:
    image: ${IMAGE_PREFIX:-}nba-scraper:${IMAGE_TAG:-latest}
    volumes: !reset []

  dbt:
    image: ${IMAGE_PREFIX:-}nba-dbt:${IMAGE_TAG:-latest}
    volumes: !reset []

  ml:
    image: ${IMAGE_PREFIX:-}nba-ml:${IMAGE_TAG:-latest}
    volumes: !reset []

  mcp:
    image: ${IMAGE_PREFIX:-}nba-mcp:${IMAGE_TAG:-latest}
    volumes: !reset []
    mem_limit: 512m
    # No published port: Caddy serves MCP at https://<host>/mcp over the existing
    # certificate. Publishing 8001 meant clients sent Authorization: Bearer
    # $MCP_API_TOKEN over plain HTTP, and it was an internet-facing port that
    # bypassed the proxy entirely.
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MCP_PATH: /mcp
      MCP_API_TOKEN: ${MCP_API_TOKEN:-}

  cube:
    image: ${IMAGE_PREFIX:-}nba-cube:${IMAGE_TAG:-latest}
    ports: !reset []
    mem_limit: 1g
    environment:
      CUBEJS_DEV_MODE: "false"
      # Dev mode off makes Cube default its queue/cache driver to Cube Store,
      # which we do not deploy; a load request then fails with "Cube Store was
      # specified as queue/cache driver". In-process memory is fine here: one
      # Cube instance, no pre-aggregations. Adding either would need a real
      # cubestore service.
      CUBEJS_CACHE_AND_QUEUE_DRIVER: memory

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on:
      - api
      - frontend

volumes:
  caddy_data:
  caddy_config:
