# Frontend + Python tests, pre-commit, every e2e suite, and optional OCI deploy.
# The Python matrix runs each service's full suite, Testcontainers integration
# tests included — those are the only ones that exercise Alembic against a real
# database and the gold fixture schema, which is where breakage has historically
# gone unnoticed. The admin job runner e2e needs a real Compose Postgres instead.
# images + deploy run only when ENABLE_OCI_DEPLOY=true and not on pull_request.
# images builds native arm64 on GitHub's free-for-public-repos ARM runner and
# pushes all repo-built production/job images to GHCR; the VM only pulls, so no Next.js build ever runs on the 12GB box.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (lint, format, types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: make quality

  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: make test-frontend

  frontend-e2e:
    name: Frontend e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      # Playwright starts its own dev server on :3100 against a mocked API,
      # so this needs no database or running API.
      - run: make test-frontend-e2e

  dbt-e2e:
    name: dbt e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds the migrate + dbt images and seeds an ephemeral Postgres via
      # docker-compose.e2e.yml; the target tears the stack down afterwards.
      - run: make test-dbt

  dbt-score:
    name: dbt score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: services/dbt/uv.lock
      # No Postgres needed: see scripts/dbt-score.sh.
      - run: make dbt-score

  python:
    name: Python tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [lib, api, scraper, mcp, cube, ml, migrate]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            services/*/uv.lock
            lib/*/uv.lock
      - run: make test-${{ matrix.service }}

  admin-jobs-e2e:
    name: Admin job runner e2e
    runs-on: ubuntu-latest
    # Its own Compose project, like the dbt e2e. The teardown below is
    # `down -v`, and running that against the default `nba` project would
    # delete a developer's warehouse if this recipe were ever copied locally.
    env:
      COMPOSE_PROJECT_NAME: nba-admin-e2e
      # Everything here goes through `compose exec`, so the published port is
      # only a collision risk. Off the default so the job does not depend on
      # 5432 being free on the runner.
      POSTGRES_PORT: "55432"
    steps:
      - uses: actions/checkout@v7
      # The runner is shell + SQL against a live database, so this needs a real
      # Postgres with the source schema applied — not Testcontainers.
      - name: Start Postgres and apply migrations
        run: |
          cp .env.example .env
          docker compose up -d postgres --wait
          make db-migrate
      # Job targets fail fast on the IMAGE_PREFIX guard, which is fine: the
      # assertions are about claiming, locking, reaping and recording, not
      # about the work itself succeeding.
      - run: make test-admin-jobs
      - name: Tear down
        if: always()
        run: docker compose down -v

  # OCI Ampere A1 is aarch64, so this must be an arm64 runner. Do not swap to
  # ubuntu-latest and qemu-emulate — the Next.js build takes ~10x longer.
  images:
    name: Build and push images
    if: vars.ENABLE_OCI_DEPLOY == 'true' && github.event_name != 'pull_request'
    needs: [quality, frontend, frontend-e2e, dbt-e2e, dbt-score, python, admin-jobs-e2e]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.prefix.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR rejects uppercase path segments; owner casing is not guaranteed.
      - id: prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/" >> "$GITHUB_OUTPUT"
      - name: Bake and push production images
        run: docker buildx bake --file docker-bake.hcl --push prod
        env:
          DOCKER_TARGET: runtime
          PLATFORMS: linux/arm64
          IMAGE_PREFIX: ${{ steps.prefix.outputs.value }}
          IMAGE_TAG: ${{ github.sha }}
          GIT_SHA: ${{ github.sha }}
          NEXT_PUBLIC_API_URL: https://baseline.jyablonski.dev

  deploy:
    name: Deploy to Server
    if: vars.ENABLE_OCI_DEPLOY == 'true' && github.event_name != 'pull_request'
    needs: [images]
    runs-on: ubuntu-latest
    steps:
      # Pinning the sha (not latest) makes the deployed commit unambiguous and
      # lets a rollback re-run this with an older tag.
      - name: SSH prod-deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 20m
          script_stop: true
          script: >-
            cd /opt/nba &&
            make prod-deploy
            IMAGE_PREFIX=${{ needs.images.outputs.prefix }}
            IMAGE_TAG=${{ github.sha }}

  # Fires on main pushes only, and `always()` so a failed job still reports.
  # Needs every job: `contains(needs.*.result, 'failure')` is what picks the
  # template, so anything omitted here cannot turn the message red.
  notify:
    name: Slack Notification
    needs:
      [quality, frontend, frontend-e2e, dbt-e2e, dbt-score, python, admin-jobs-e2e, images, deploy]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Slack Notification
        uses: jyablonski/actions/deploy-notification@v1
        with:
          slack-webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          template: ${{ contains(needs.*.result, 'failure') && 'pipeline-failure' || 'deployment-success' }}
