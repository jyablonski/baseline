[project]
name = "nba-scraper"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "sqlalchemy==2.0.57",
    "psycopg2-binary==2.9.13",
    "python-dotenv==1.2.4",
    "tenacity==9.2.1",
    "click==8.5.0",
    "pydantic-settings==2.16.1",
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "praw==8.0.3",
    "tzdata==2026.5",
]

[dependency-groups]
dev = [
    "pytest-cov==7.1.0",
    "pytest==9.2.0",
    "testcontainers[postgres]==4.15.0",
    "ty==0.0.92",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# `../..` is the repo root, for the shared `testing.postgres_tc` helpers.
pythonpath = ["src", "../.."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=90",
    "--color=yes",
]
markers = [
    "unit: Unit tests that don't require external dependencies",
    "integration: Tests that require Docker / Testcontainers Postgres",
]

# Anchors ty to this service so it does not walk up and type-check the whole
# repo against this venv. Mirrors the `src` entry in pytest's pythonpath.
[tool.ty.environment]
extra-paths = ["src"]

# Check shipped code only: tests pass duck-typed doubles where a concrete class
# is annotated, which is intentional.
[tool.ty.src]
include = ["src"]
