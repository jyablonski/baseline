[project]
name = "nba-scraper"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "sqlalchemy==2.0.52",
    "psycopg2-binary==2.9.12",
    "python-dotenv==1.2.3",
    "tenacity==9.1.4",
    "click==8.5.0",
    "pydantic-settings==2.15.0",
    "requests==2.34.2",
    "beautifulsoup4==4.13.5",
    "praw==8.0.3",
    "tzdata==2026.4",
]

[dependency-groups]
dev = [
    "pytest-cov==7.1.0",
    "pytest==9.1.1",
    "testcontainers[postgres]==4.15.0",
    "ty==0.0.78",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# `../..` is the repo root, for the shared `testing.postgres_tc` helpers.
pythonpath = ["src", "../.."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=90",
    "--color=yes",
]
markers = [
    "unit: Unit tests that don't require external dependencies",
    "integration: Tests that require Docker / Testcontainers Postgres",
]

# Anchors ty to this service so it does not walk up and type-check the whole
# repo against this venv. Mirrors the `src` entry in pytest's pythonpath.
# The `# ty: ignore` comments in src/scrapers are BeautifulSoup stub
# imprecision: find_all/find are typed as returning PageElement, but the
# parsers only reach them on Tag. Not runtime bugs.
[tool.ty.environment]
extra-paths = ["src"]

# Check shipped code only: tests pass duck-typed doubles where a concrete class
# is annotated, which is intentional.
[tool.ty.src]
include = ["src"]
