version: 2

macros:
  - name: generate_schema_name
    description: Uses a model's custom schema as-is instead of dbt's default target_schema + custom concatenation, so +schema gold builds into gold rather than gold_gold.
    arguments:
      - name: custom_schema_name
        type: optional[string]
        description: The model's +schema config (silver or gold); none falls back to the profile target schema.
      - name: node
        type: any
        description: The node being built. Required by dbt's macro signature; unused here.

  - name: normalize_player_name
    description: SQL expression that lowercases a name, strips generational suffixes (Jr., Sr., II, III, IV), and collapses punctuation and whitespace to single spaces. Postgres counterpart of the scraper's normalize_player_name, minus its ASCII folding; accented letters are treated as punctuation here (Jokić becomes joki). Also reused on Reddit free text, where needle and haystack must normalize identically.
    arguments:
      - name: column
        type: string
        description: SQL expression (usually a column reference) to normalize.

  - name: ordinal
    description: SQL expression that renders an integer as an English ordinal string (1st, 2nd, 3rd, 11th, 22nd). Used for highlight headlines.
    arguments:
      - name: expression
        type: string
        description: Integer SQL expression (usually a column reference) to render.

  - name: injury_status
    description: SQL expression mapping a Basketball-Reference injury note to its status (Out, Day To Day, Out For Season) from the text before the first parenthesis, case-insensitively. Any other lead is Listed, never a guess.
    arguments:
      - name: description
        type: string
        description: SQL expression holding the injury note.

  - name: injury_detail
    description: SQL expression for the body part in the note's first parentheses ("Ankle" from "Out (Ankle) - ..."); null when there is none.
    arguments:
      - name: description
        type: string
        description: SQL expression holding the injury note.

  - name: previous_season
    description: SQL expression for the season label before the given one ("2026-27" gives "2025-26").
    arguments:
      - name: season
        type: string
        description: SQL expression holding a season label.
