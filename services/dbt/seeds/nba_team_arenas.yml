version: 2

seeds:
  - name: nba_team_arenas
    description: >
      Versioned lookup of each current NBA franchise's home arena.
      Grain is one row per canonical team UUID (current homes). Coordinates are
      WGS84 from published venue locations (Wikipedia / OpenStreetMap).
      Update this seed when a
      team moves buildings; do not geocode at scrape time.
    config:
      column_types:
        team_id: uuid
        abbreviation: varchar(5)
        arena_name: varchar(100)
        arena_city: varchar(50)
        arena_state: varchar(50)
        arena_latitude: numeric(9, 6)
        arena_longitude: numeric(9, 6)
    columns:
      - name: team_id
        description: Canonical team UUID; matches source.teams / dim_teams.
        data_tests:
          - unique
          - not_null
      - name: abbreviation
        description: Team abbreviation, for readability; team_id is the join key.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 3
      - name: arena_name
        description: Current home arena name.
        data_tests:
          - not_null
      - name: arena_latitude
        description: WGS84 latitude of the current home arena.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -90
                max_value: 90
      - name: arena_longitude
        description: WGS84 longitude of the current home arena.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -180
                max_value: 180
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal:
          arguments:
            value: 30
