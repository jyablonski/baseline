version: 2

seeds:
  - name: nba_team_colors
    description: >
      Versioned lookup of each current NBA franchise's primary and alternate brand hex colors.
      Grain is one row per canonical team UUID. Hex values follow published NBA brand palettes (same family of sources as teamcolorcodes / official style guides).
      Brand colors are repo-owned reference data, not scraped identity data.
      Update this seed when a franchise rebrands; do not invent colors at scrape time.
    config:
      column_types:
        team_id: uuid
        abbreviation: varchar(5)
        primary_color: varchar(7)
        alternate_color: varchar(7)
    columns:
      - name: team_id
        description: Canonical team UUID; matches source.teams / dim_teams.
        data_tests:
          - unique
          - not_null
      - name: abbreviation
        description: Team abbreviation, for readability; team_id is the join key.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 3
      - name: primary_color
        description: Primary brand hex (#RRGGBB).
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^#[0-9A-Fa-f]{6}$"
      - name: alternate_color
        description: Alternate / secondary brand hex (#RRGGBB), used when two primaries collide on a plot.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^#[0-9A-Fa-f]{6}$"
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal:
          arguments:
            value: 30
