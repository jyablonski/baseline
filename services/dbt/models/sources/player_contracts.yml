version: 2

sources:
  - name: source
    schema: source
    tables:
      - name: player_contracts
        description: >
          Remaining player-season salaries from Basketball-Reference team payroll pages.
        columns:
          - name: id
            description: Surrogate key.
          - name: player_id
            description: Baseline player UUID.
          - name: team_id
            description: Team the contract is with (Baseline team UUID).
          - name: player_name
            description: Name as shown on the payroll page.
          - name: player_name_normalized
            description: Lowercased, ASCII-folded, suffix-stripped name used for matching.
          - name: season
            description: Season the salary is for, e.g. 2025-26.
          - name: salary
            description: Salary for that season (USD).
          - name: is_fully_guaranteed
            description: False when Basketball-Reference shows the amount in italics (not fully guaranteed).
          - name: remaining_guaranteed
            description: Remaining guaranteed money on the whole contract (USD), repeated on each season row.
          - name: player_age
            description: Player age as listed on the payroll page.
          - name: source_url
            description: Basketball-Reference page the row was parsed from.
          - name: scraped_at
            description: When the scraper last wrote this row.
