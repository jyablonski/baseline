version: 2

sources:
  - name: source
    schema: source
    tables:
      - name: standings
        description: >
          Season-to-date Regular Season standings from Basketball-Reference. Unique on (season, season_type, team_id);
          as_of_date is the scrape watermark.
        columns:
          - name: id
            description: Surrogate key.
          - name: team_id
            description: Baseline team UUID.
          - name: season
            description: NBA season label, e.g. 2025-26.
          - name: season_type
            description: Regular Season.
          - name: as_of_date
            description: Date of the scrape that produced this snapshot.
          - name: conference
            description: East or West.
          - name: division
            description: Division name.
          - name: conference_rank
            description: Record-based rank within the conference.
          - name: division_rank
            description: Record-based rank within the division.
          - name: wins
            description: Wins to date.
          - name: losses
            description: Losses to date.
          - name: win_pct
            description: Win percentage (0-1).
          - name: games_back
            description: Games behind the leader.
          - name: conf_games_back
            description: Not populated by the Basketball-Reference scraper; always null.
          - name: streak
            description: Current streak, e.g. W 3.
          - name: last_10
            description: Record over the last 10 games, e.g. 7-3.
          - name: scraped_at
            description: When the scraper last wrote this row.
