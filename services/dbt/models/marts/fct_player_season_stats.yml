version: 2

models:
  - name: fct_player_season_stats
    description: >
      Per-player per-season averages from loaded game logs (PPG / RPG / APG).
      Grain is player_id x season. games_played is the qualifier column; this
      mart does not apply a league-minimum filter.
    columns:
      - name: player_id
        description: Baseline player UUID.
        data_tests:
          - not_null
      - name: season
        description: NBA season label, e.g. 2025-26.
        data_tests:
          - not_null
      - name: games_played
        description: >
          Count of loaded logs for that player × season (regular season,
          play-in, and playoffs). Same ceiling as
          int_player_game_logs_enriched.season_game_number: 82 is not the
          max; a deep playoff run can exceed 100 (~112 theoretical).
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 120
      - name: ppg
        description: Average points per loaded game log, rounded to one decimal.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
                row_condition: "ppg is not null"
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["player_id", "season"]
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
