version: 2

models:
  - name: fct_games_schedule
    description: >
      Thin games-with-status mart (Final and upcoming). Do not use this as
      a completed-game fact; fct_team_game_results stays Final-only.
    config:
      meta:
        grain: One row per game, scheduled or Final.
    columns:
      - name: game_id
        description: Baseline game UUID.
        data_tests:
          - unique
          - not_null
      - name: game_date
        description: Scheduled game date in Eastern Time.
        data_tests:
          - not_null
      - name: start_time_et
        description: Scheduled tip-off time in Eastern Time; null when unpublished.
      - name: national_tv
        description: Comma-separated national TV and streaming networks from ESPN, e.g. "ESPN, ABC"; null for a local-only game or one ESPN has not listed.
      - name: season
        description: NBA season label, e.g. 2025-26.
        data_tests:
          - not_null
      - name: status
        description: "Game status from the schedule: Final or Scheduled."
        data_tests:
          - not_null
      - name: home_team_id
        description: Home team (Baseline team UUID).
        data_tests:
          - not_null
      - name: away_team_id
        description: Away team (Baseline team UUID).
        data_tests:
          - not_null
      - name: home_is_back_to_back
        description: True when the home team played the day before (Eastern game date), the second night of a back-to-back. Previous game is within the same season.
        data_tests:
          - not_null
      - name: home_last_night_opponent_abbreviation
        description: The home team's opponent the night before; null unless home_is_back_to_back.
      - name: home_last_night_was_home
        description: Whether the home team was at home the night before; null unless home_is_back_to_back.
      - name: home_last_night_score
        description: The home team's points the night before; null unless home_is_back_to_back, and null while that game is not Final yet.
      - name: home_last_night_opponent_score
        description: Its opponent's points the night before; null under the same conditions as home_last_night_score.
      - name: away_is_back_to_back
        description: True when the away team played the day before (Eastern game date), the second night of a back-to-back. Previous game is within the same season.
        data_tests:
          - not_null
      - name: away_last_night_opponent_abbreviation
        description: The away team's opponent the night before; null unless away_is_back_to_back.
      - name: away_last_night_was_home
        description: Whether the away team was at home the night before; null unless away_is_back_to_back.
      - name: away_last_night_score
        description: The away team's points the night before; null unless away_is_back_to_back, and null while that game is not Final yet.
      - name: away_last_night_opponent_score
        description: Its opponent's points the night before; null under the same conditions as away_last_night_score.
