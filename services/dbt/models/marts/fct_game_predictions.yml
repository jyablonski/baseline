version: 2

models:
  - name: fct_game_predictions
    description: >
      Thin gold copy of the latest champion pregame home win probability per
      game. Pregame only; not live WP.
    columns:
      - name: game_id
        description: Baseline game UUID.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_games_schedule')
                field: game_id
      - name: model_wp
        description: Champion model's pregame home win probability.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                strictly: true
      - name: away_wp
        description: Derived away-team probability; exactly 1 - model_wp.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                strictly: true
      - name: market_wp
        description: Consensus de-vigged home win probability from the odds at scoring time; null when no line matched the game.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                strictly: true
                row_condition: "market_wp is not null"
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["game_id", "model_version"]
