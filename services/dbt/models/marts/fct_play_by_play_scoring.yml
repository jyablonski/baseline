version: 2

models:
  - name: fct_play_by_play_scoring
    description: >
      Gold scoring-play series for the game-flow chart. One row per
      score change (game_id x action_number). Differential is home minus away.
      Not live win probability.
    columns:
      - name: game_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_team_game_results')
                field: game_id
      - name: action_number
        data_tests:
          - not_null
      - name: score_differential
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -200
                max_value: 200
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["game_id", "action_number"]
