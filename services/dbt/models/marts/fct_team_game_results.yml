version: 2

models:
  - name: fct_team_game_results
    description: One row per final game with home/away team context and winner location.
    columns:
      - name: game_id
        description: Unique NBA game identifier.
        data_tests:
          - unique
          - not_null
      - name: winner_location
        description: "home or away: which side won."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: ["home", "away"]
                quote_values: true
      - name: home_score
        description: Home team final score.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 400
      - name: away_score
        description: Away team final score.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 400
      - name: score_margin
        description: Absolute final score difference.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 400
    data_tests:
      # Empty between seasons (and after a prod reset): warn, don't fail the build.
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
          config:
            severity: warn
