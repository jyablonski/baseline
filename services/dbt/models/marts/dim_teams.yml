version: 2

models:
  - name: dim_teams
    description: Team dimension for analytics joins.
    columns:
      - name: team_id
        description: Unique NBA team identifier.
        data_tests:
          - unique
          - not_null
      - name: abbreviation
        description: Three-letter team abbreviation, e.g. BOS.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 3
      - name: conference
        description: Conference, East or West.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: ["East", "West"]
                quote_values: true
      - name: team_name
        description: Full team name, e.g. Boston Celtics.
        data_tests:
          - dbt_expectations.expect_column_values_to_not_be_null
      - name: current_season_payroll
        description: Team Totals salary for the earliest season in the payroll snapshot.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 5000000000
                row_condition: "current_season_payroll is not null"
      - name: salary_cap
        description: Official CBA salary cap for current_contract_season from seed nba_cba_caps.
      - name: luxury_tax
        description: Official CBA tax level for current_contract_season from seed nba_cba_caps.
      - name: first_apron
        description: Official CBA first apron for current_contract_season from seed nba_cba_caps.
      - name: second_apron
        description: Official CBA second apron for current_contract_season from seed nba_cba_caps.
      - name: over_luxury_tax
        description: True when the BRef payroll snapshot is above the season tax level.
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: over_first_apron
        description: True when the BRef payroll snapshot is above the season first apron.
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: over_second_apron
        description: True when the BRef payroll snapshot is above the season second apron.
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: arena_name
        description: >
          Current home arena name from seed nba_team_arenas.
          Null when the team_id is not in that seed.
      - name: arena_latitude
        description: >
          WGS84 latitude of the current home arena. Null when unknown
          (team not in nba_team_arenas). The 30 current NBA teams are
          populated by the seed.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -90
                max_value: 90
                row_condition: "arena_latitude is not null"
      - name: arena_longitude
        description: >
          WGS84 longitude of the current home arena. Null when unknown
          (team not in nba_team_arenas). The 30 current NBA teams are
          populated by the seed.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -180
                max_value: 180
                row_condition: "arena_longitude is not null"
      - name: primary_color
        description: >
          Primary brand hex from seed nba_team_colors. Null when the
          team_id is not in that seed.
        data_tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^#[0-9A-Fa-f]{6}$"
                row_condition: "primary_color is not null"
      - name: alternate_color
        description: >
          Alternate brand hex from seed nba_team_colors. Used when two
          teams share a similar primary on the game-flow plot.
        data_tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^#[0-9A-Fa-f]{6}$"
                row_condition: "alternate_color is not null"
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
            max_value: 50
