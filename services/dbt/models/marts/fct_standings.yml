version: 2

models:
  - name: fct_standings
    description: >
      Season-to-date Regular Season standings joined to team attributes.
      Grain is team_id x season x season_type: every team-season with scraped
      standings or at least one Regular Season Final. Scraped values win field by
      field; whatever the source leaves out (form columns, division ranks, a
      leader's games_back, or a whole season it has not scraped) is derived in
      int_standings_records from fct_team_game_results, once, for the API, Cube,
      and MCP alike. This mart adds the playoff seed.
    config:
      meta:
        grain: One row per team per season per season type.
    columns:
      - name: playoff_seed
        description: >
          Final seed 1-10 after the play-in, or null when the conference has not
          finished its play-in games. Differs from conference_rank on upsets, so
          order by this when showing a settled bracket.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 10
                row_condition: "playoff_seed is not null"
      - name: team_id
        description: Baseline team UUID.
        data_tests:
          - not_null
      - name: season
        description: NBA season label, e.g. 2025-26.
        data_tests:
          - not_null
      - name: conference
        description: Conference, East or West.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: ["East", "West"]
                quote_values: true
                row_condition: "conference is not null"
      - name: conference_rank
        description: >
          Record-based rank within the conference (1-15). The scraped rank when there
          is one; otherwise win % with NBA tiebreakers (see int_standings_records).
          Ignores play-in results; see playoff_seed.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 15
                row_condition: "conference_rank is not null"
      - name: division_rank
        description: >
          Rank within the division (1-5), always derived: the source never carries
          one. Win %, then the NBA tiebreakers that apply inside a division.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
      - name: as_of_date
        description: Scrape watermark of the standings row; null when record_source is games.
      - name: record_source
        description: >
          official when the row came from scraped standings, games when it is
          derived entirely from Regular Season Finals because the source has no
          row for that team-season.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["official", "games"]
      - name: games_back
        description: >
          Games behind the conference leader. The scraped value when there is one;
          otherwise ((leader wins - wins) + (losses - leader losses)) / 2, which is
          0 for the leader.
      - name: streak
        description: >
          Current run of results, e.g. W3 or L1. The scraped value when there is one;
          otherwise counted from the team's most recent Regular Season Finals in
          fct_team_game_results. Null before a team's first game of the season.
      - name: last_10
        description: >
          Wins-losses over the last ten Regular Season Finals, e.g. 8-2. Same
          source and fallback as streak.
      - name: wins
        description: Regular Season wins to date.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 82
                row_condition: "wins is not null"
      - name: losses
        description: Regular Season losses to date.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 82
                row_condition: "losses is not null"
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["team_id", "season", "season_type"]
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["season", "division", "division_rank"]
