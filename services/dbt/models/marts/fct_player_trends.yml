version: 2

models:
  - name: fct_player_trends
    description: >
      Each player's newest trend_window_games Regular Season games (minutes > 0)
      against the up to trend_baseline_games before them, current season only,
      stat by stat, with the season average for display. A stat's change counts
      only when it beats the player's game-to-game swings (`_z`, `_changed`). A player qualifies with a full window, at
      least trend_min_baseline_games earlier games and trend_min_minutes per game
      in both; trend_direction and trend_rank exist only for qualified players.
      Served by REST (GET /api/v1/players/{id}/trend and GET /api/v1/teams/{id}/trends).
    config:
      meta:
        grain: One row per player with a game played in the current Regular Season.
    columns:
      - name: player_id
        description: Baseline player UUID.
        data_tests:
          - unique
          - not_null
      - name: season
        description: NBA season label, the newest with a Regular Season game log.
        data_tests:
          - not_null
      - name: team_id
        description: Team of the player's newest counted game.
        data_tests:
          - not_null
      - name: games_played
        description: Regular Season games with minutes this season.
        data_tests:
          - not_null
      - name: window_games
        description: Games in the window, at most trend_window_games.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: "{{ var('trend_window_games') }}"
      - name: baseline_games
        description: Games in the baseline, the up to trend_baseline_games before the window.
        data_tests:
          - not_null
      - name: window_start_date
        description: First game in the window.
      - name: window_end_date
        description: Last game in the window, the player's newest game.
      - name: points_last_10
        description: "Points, per game over the newest trend_window_games games."
      - name: points_baseline
        description: "Points, per game over the up to trend_baseline_games games before the window."
      - name: points_season
        description: "Points, per game over every counted game."
      - name: points_change
        description: "Points, last_10 minus baseline."
      - name: points_z
        description: "Change over its standard error, from the per-game values in both windows (Welch's z); null when either window has under two values or neither varies."
      - name: points_changed
        description: "abs(points_z) >= trend_noise_z: the change beats normal game-to-game swings. False when z is null."
        data_tests:
          - not_null
      - name: points_games
        description: "The window's per-game values, oldest first."
      - name: rebounds_last_10
        description: "Rebounds, per game over the newest trend_window_games games."
      - name: rebounds_baseline
        description: "Rebounds, per game over the up to trend_baseline_games games before the window."
      - name: rebounds_season
        description: "Rebounds, per game over every counted game."
      - name: rebounds_change
        description: "Rebounds, last_10 minus baseline."
      - name: rebounds_z
        description: "Change over its standard error, from the per-game values in both windows (Welch's z); null when either window has under two values or neither varies."
      - name: rebounds_changed
        description: "abs(rebounds_z) >= trend_noise_z: the change beats normal game-to-game swings. False when z is null."
        data_tests:
          - not_null
      - name: rebounds_games
        description: "The window's per-game values, oldest first."
      - name: assists_last_10
        description: "Assists, per game over the newest trend_window_games games."
      - name: assists_baseline
        description: "Assists, per game over the up to trend_baseline_games games before the window."
      - name: assists_season
        description: "Assists, per game over every counted game."
      - name: assists_change
        description: "Assists, last_10 minus baseline."
      - name: assists_z
        description: "Change over its standard error, from the per-game values in both windows (Welch's z); null when either window has under two values or neither varies."
      - name: assists_changed
        description: "abs(assists_z) >= trend_noise_z: the change beats normal game-to-game swings. False when z is null."
        data_tests:
          - not_null
      - name: assists_games
        description: "The window's per-game values, oldest first."
      - name: steals_last_10
        description: "Steals, per game over the newest trend_window_games games."
      - name: steals_baseline
        description: "Steals, per game over the up to trend_baseline_games games before the window."
      - name: steals_season
        description: "Steals, per game over every counted game."
      - name: steals_change
        description: "Steals, last_10 minus baseline."
      - name: steals_z
        description: "Change over its standard error, from the per-game values in both windows (Welch's z); null when either window has under two values or neither varies."
      - name: steals_changed
        description: "abs(steals_z) >= trend_noise_z: the change beats normal game-to-game swings. False when z is null."
        data_tests:
          - not_null
      - name: steals_games
        description: "The window's per-game values, oldest first."
      - name: blocks_last_10
        description: "Blocks, per game over the newest trend_window_games games."
      - name: blocks_baseline
        description: "Blocks, per game over the up to trend_baseline_games games before the window."
      - name: blocks_season
        description: "Blocks, per game over every counted game."
      - name: blocks_change
        description: "Blocks, last_10 minus baseline."
      - name: blocks_z
        description: "Change over its standard error, from the per-game values in both windows (Welch's z); null when either window has under two values or neither varies."
      - name: blocks_changed
        description: "abs(blocks_z) >= trend_noise_z: the change beats normal game-to-game swings. False when z is null."
