      - name: three_pointers_made_changed
        description: "abs(three_pointers_made_z) >= trend_noise_z: the change beats normal game-to-game swings. False when z is null."
        data_tests:
          - not_null
      - name: three_pointers_made_games
        description: "The window's per-game values, oldest first."
      - name: turnovers_last_10
        description: "Turnovers per game over the newest trend_window_games games (lower is better)."
      - name: turnovers_baseline
        description: "Turnovers per game over the games before the window (lower is better)."
      - name: turnovers_season
        description: "Turnovers per game over every counted game (lower is better)."
      - name: turnovers_change
        description: "Turnovers, last_10 minus baseline."
      - name: turnovers_z
        description: "Change over its standard error, from the per-game values in both windows (Welch's z); null when either window has under two values or neither varies."
      - name: turnovers_changed
        description: "abs(turnovers_z) >= trend_noise_z: the change beats normal game-to-game swings. False when z is null."
        data_tests:
          - not_null
      - name: turnovers_games
        description: "The window's per-game values, oldest first."
      - name: minutes_last_10
        description: "Minutes, per game over the newest trend_window_games games."
      - name: minutes_baseline
        description: "Minutes, per game over the up to trend_baseline_games games before the window."
      - name: minutes_season
        description: "Minutes, per game over every counted game."
      - name: minutes_change
        description: "Minutes, last_10 minus baseline."
      - name: minutes_z
        description: "Change over its standard error, from the per-game values in both windows (Welch's z); null when either window has under two values or neither varies."
      - name: minutes_changed
        description: "abs(minutes_z) >= trend_noise_z: the change beats normal game-to-game swings. False when z is null."
        data_tests:
          - not_null
      - name: minutes_games
        description: "The window's per-game values, oldest first."
      - name: plus_minus_last_10
        description: "Plus-minus, per game over the newest trend_window_games games."
      - name: plus_minus_baseline
        description: "Plus-minus, per game over the up to trend_baseline_games games before the window."
      - name: plus_minus_season
        description: "Plus-minus, per game over every counted game."
      - name: plus_minus_change
        description: "Plus-minus, last_10 minus baseline."
      - name: plus_minus_z
        description: "Change over its standard error, from the per-game values in both windows (Welch's z); null when either window has under two values or neither varies."
      - name: plus_minus_changed
        description: "abs(plus_minus_z) >= trend_noise_z: the change beats normal game-to-game swings. False when z is null."
        data_tests:
          - not_null
      - name: plus_minus_games
        description: "The window's per-game values, oldest first."
      - name: game_score_last_10
        description: "Game Score (mvp_box_score), per game over the newest trend_window_games games."
      - name: game_score_baseline
        description: "Game Score (mvp_box_score), per game over the up to trend_baseline_games games before the window."
      - name: game_score_season
        description: "Game Score (mvp_box_score), per game over every counted game."
      - name: game_score_change
        description: "Game Score, last_10 minus baseline."
      - name: game_score_z
        description: "Change over its standard error, from the per-game values in both windows (Welch's z); null when either window has under two values or neither varies."
      - name: game_score_changed
        description: "abs(game_score_z) >= trend_noise_z: the change beats normal game-to-game swings. False when z is null."
        data_tests:
          - not_null
      - name: game_score_games
        description: "The window's per-game values, oldest first."
      - name: mvp_game_score_last_10
        description: "MVP game score (win-weighted Game Score, no availability multiplier), per game over the newest trend_window_games games."
      - name: mvp_game_score_baseline
        description: "MVP game score (win-weighted Game Score, no availability multiplier), per game over the up to trend_baseline_games games before the window."
      - name: mvp_game_score_season
        description: "MVP game score (win-weighted Game Score, no availability multiplier), per game over every counted game."
      - name: mvp_game_score_change
        description: "MVP game score, last_10 minus baseline."
      - name: mvp_game_score_z
        description: "Change over its standard error, from the per-game values in both windows (Welch's z); null when either window has under two values or neither varies."
      - name: mvp_game_score_changed
        description: "abs(mvp_game_score_z) >= trend_noise_z: the change beats normal game-to-game swings. False when z is null."
        data_tests:
          - not_null
      - name: mvp_game_score_games
        description: "The window's per-game values, oldest first."
      - name: true_shooting_pct_last_10
        description: "True shooting over the window's totals, PTS / (2 * (FGA + 0.44 * FTA)); null without a shot attempt."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1.5
                row_condition: "true_shooting_pct_last_10 is not null"
      - name: true_shooting_pct_baseline
        description: "True shooting over the baseline's totals, PTS / (2 * (FGA + 0.44 * FTA)); null without a shot attempt."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1.5
                row_condition: "true_shooting_pct_baseline is not null"
      - name: true_shooting_pct_season
        description: "True shooting over the season's totals, PTS / (2 * (FGA + 0.44 * FTA)); null without a shot attempt."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1.5
                row_condition: "true_shooting_pct_season is not null"
      - name: true_shooting_pct_change
        description: "True shooting, last_10 minus baseline."
      - name: true_shooting_pct_z
        description: "Change over its standard error, from the per-game values in both windows (Welch's z); null when either window has under two values or neither varies."
      - name: true_shooting_pct_changed
        description: "abs(true_shooting_pct_z) >= trend_noise_z: the change beats normal game-to-game swings. False when z is null."
        data_tests:
          - not_null
      - name: true_shooting_pct_games
        description: "The window's per-game values, oldest first (per-game TS%, null without a shot attempt)."
      - name: is_qualified
        description: Full window, enough baseline games, and enough minutes in both.
        data_tests:
          - not_null
      - name: trend_direction
        description: "up / down when mvp_game_score_z reaches trend_noise_z either way, else steady; null when not qualified."
        data_tests:
          - accepted_values:
              arguments:
                values: ["up", "down", "steady"]
      - name: trend_rank
        description: League rank by MVP game score change among qualified players, 1 = biggest riser; null when not qualified.

unit_tests:
  - name: player_trends_change_must_beat_game_to_game_swings
    description: >
      Three-game windows. The riser's last three (30, 32, 34) sit far above the
      three before (10, 12, 14), so z = 20 / sqrt(4/3 + 4/3) = 12.25 and it is up;
      the 100 before those is outside the capped baseline. The swinger moves by 5
      but swings by 10 a game, so z = 5 / sqrt(100/3 + 100/3) = 0.61: steady.
    model: fct_player_trends
    overrides:
      vars:
        trend_window_games: 3
        trend_baseline_games: 3
        trend_min_baseline_games: 2
        trend_min_minutes: 0
        trend_noise_z: 2.0
