      - name: three_pointers_made_last_10
        description: "Three-pointers made, per game over the newest trend_window_games games."
      - name: three_pointers_made_baseline
        description: "Three-pointers made, per game over the up to trend_baseline_games games before the window."
      - name: three_pointers_made_season
        description: "Three-pointers made, per game over every counted game."
      - name: three_pointers_made_change
        description: "Three-pointers made, last_10 minus baseline."
      - name: three_pointers_made_z
