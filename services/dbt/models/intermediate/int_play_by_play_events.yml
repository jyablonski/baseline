version: 2

models:
  - name: int_play_by_play_events
    description: >
      Basketball-Reference actions typed by parsing the free-text description.
      BRef leaves action_type / sub_type null on every row, so event_type, shot
      detail (value, type, distance), typed fouls / turnovers / violations,
      free-throw kind and sequence, rebound side, timeouts and replays are all
      derived here. player_id is the primary actor and secondary_player_id is
      the assister / stealer / blocker / fouled / subbed-out player; the latter
      is only populated for games ingested after that fix, so it is null for
      rows loaded earlier until they are re-scraped with --refresh.
    columns:
      - name: game_id
        description: Baseline game UUID.
        data_tests:
          - not_null
      - name: event_type
        description: Typed action. "other" means the description matched no known pattern.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - shot_made
                  - shot_missed
                  - heave
                  - free_throw_made
                  - free_throw_missed
                  - rebound
                  - turnover
                  - foul
                  - ejection
                  - substitution
                  - timeout
                  - violation
                  - jump_ball
                  - replay
                  - period_start
                  - period_end
                  - other
      - name: shot_value
        description: 2 or 3 for a field-goal attempt, parsed from the description; null for non-shots and heaves.
        data_tests:
          - accepted_values:
              config:
                where: "shot_value is not null"
              arguments:
                values: [2, 3]
                quote: false
      - name: shot_distance_ft
        description: Shot distance in feet from the description; 0 for 'at rim'. Null when not stated.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 95
                row_condition: "shot_distance_ft is not null"
      - name: rebound_side
        description: offensive or defensive; null when the row is not a rebound.
        data_tests:
          - accepted_values:
              config:
                where: "rebound_side is not null"
              arguments:
                values: [offensive, defensive]
      - name: free_throw_kind
        description: regular, technical, flagrant, or clear path. Defaults to regular, so only meaningful on free-throw rows.
        data_tests:
          - accepted_values:
              config:
                where: "event_type like 'free_throw%'"
              arguments:
                values: [regular, technical, flagrant, clear path]
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["game_id", "action_number", "action_id"]
