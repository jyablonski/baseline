version: 2

models:
  - name: int_player_injuries_matched
    description: Injuries after provider-key resolution at ingest.
    columns:
      - name: player_id
        description: Baseline player UUID.
        data_tests:
          - not_null
      - name: team_id
        description: Team listing the injury (Baseline team UUID).
        data_tests:
          - not_null
      - name: match_method
        description: "How the row was linked to canonical ids. Always external_id: the scraper resolves Basketball-Reference ids at ingest."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: ["external_id"]
                quote_values: true
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["player_id", "team_id"]
