version: 2

models:
  - name: int_player_injuries_matched
    description: Injuries after provider-key resolution at ingest.
    config:
      meta:
        grain: One row per player per team on the current injury report.
    columns:
      - name: player_id
        description: Baseline player UUID.
        data_tests:
          - not_null
      - name: team_id
        description: Team listing the injury (Baseline team UUID).
        data_tests:
          - not_null
      - name: injury_status
        description: Status parsed from the note by the injury_status macro.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Out", "Day To Day", "Out For Season", "Listed"]
      - name: injury_detail
        description: Body part from the note's parentheses; null when the note has none.
      - name: match_method
        description: "How the row was linked to canonical ids. Always external_id: the scraper resolves Basketball-Reference ids at ingest."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: ["external_id"]
                quote_values: true
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["player_id", "team_id"]
