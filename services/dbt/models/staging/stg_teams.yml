version: 2

models:
  - name: stg_teams
    description: Cleaned team reference data with standardized team_name.
    columns:
      - name: team_id
        description: Unique NBA team identifier.
        data_tests:
          - unique
          - not_null
      - name: abbreviation
        description: Three-letter team abbreviation, e.g. BOS.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 3
      - name: team_name
        description: Full team name (source full_name), e.g. Boston Celtics.
        data_tests:
          - dbt_expectations.expect_column_values_to_not_be_null
      - name: conference
        description: Conference, East or West.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: ["East", "West"]
                quote_values: true
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
            max_value: 50
