version: 2

sources:
  - name: source
    schema: source
    tables:
      - name: players
        description: Baseline player registry with provider-independent UUID identity.
      - name: teams
        description: Repo-owned franchise catalog with provider-independent UUID identity.
      - name: games
        description: Basketball-Reference schedule and result rows keyed by Baseline UUIDs.
      - name: player_game_logs
        description: Basketball-Reference box-score rows keyed by Baseline UUIDs.
      - name: player_contracts
        description: >
          Remaining player-season salaries from Basketball-Reference team payroll pages.
      - name: team_payroll
        description: >
          Team-season payroll totals from the Basketball-Reference
          Team Totals footer. Luxury-tax rules are not applied.
      - name: standings
        description: >
          Season-to-date Regular Season standings from Basketball-Reference. Unique on (season, season_type, team_id);
          as_of_date is the scrape watermark.
      - name: player_injuries
        description: >
          Current Basketball-Reference injury report snapshot. Unique on
          (player_id, team_id). Not a historical
          ledger; history exists only from the day scraping starts.
      - name: player_injuries_history
        description: >
          Append-only daily Basketball-Reference injury snapshots. Unique on
          (player_id, team_id, snapshot_date).
      - name: game_odds
        description: >
          The Odds API h2h / spreads lines. Upcoming events are refreshed each
          scrape and pruned if they leave the feed; a started event keeps its
          last pregame row as history (accruing from 2026-27). Unique on
          (odds_event_id, bookmaker, market). Historical odds backfill is out
          of scope. ODDS_API_KEY required to ingest.
      - name: game_predictions
        description: >
          Pregame home win probabilities written by services/ml. Grain is
          (game_id, as_of, model_version).
      - name: model_artifacts
        description: >
          Versioned ML artifacts and the single configured champion model.
      - name: model_evaluations
        description: >
          Persisted per-season evaluation metrics for versioned ML models.
      - name: play_by_play
        description: >
          Basketball-Reference play-by-play actions. Unique on (game_id, action_number, action_id).
          Opt-in current-season ingest; not a full-history backfill.
      - name: transactions
        description: >
          Basketball-Reference transactions log. Grain is transaction_key,
          sha256(transaction_date|description).
      - name: transaction_participants
        description: >
          Teams and players named by a transaction, resolved from href slugs.
          Unique on (transaction_key, participant_type, bref_slug, direction);
          a team sending and receiving in one trade is two rows.
      - name: reddit_posts
        description: >
          PRAW submission ingest. Unique on reddit_id.
      - name: reddit_comments
        description: >
          PRAW comment ingest. Unique on reddit_id. post_reddit_id
          associates the comment to reddit_posts.
