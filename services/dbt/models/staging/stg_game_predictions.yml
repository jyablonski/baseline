version: 2

models:
  - name: stg_game_predictions
    description: >
      Pregame home win probabilities written by services/ml. Grain is
      game_id x model_version: each run overwrites the row in place.
      market_wp is null when odds did not match that game.
    columns:
      - name: game_id
        description: Baseline game UUID.
        data_tests:
          - not_null
      - name: as_of
        description: When services/ml produced this prediction.
        data_tests:
          - not_null
      - name: model_version
        description: Model version string, e.g. elo-v0.
        data_tests:
          - not_null
      - name: model_wp
        description: Model's pregame home win probability.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                strictly: true
      - name: market_wp
        description: Consensus de-vigged home win probability from the odds at scoring time; null when no line matched the game.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                strictly: true
                row_condition: "market_wp is not null"
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["game_id", "model_version"]
