version: 2

models:
  - name: stg_games_schedule
    description: >
      All source.games rows including Scheduled / upcoming (nullable scores).
      Final-only results stay on stg_games / fct_team_game_results.
    columns:
      - name: game_id
        description: Unique NBA game identifier (Final or upcoming).
        data_tests:
          - unique
          - not_null
      - name: game_date
        description: Scheduled game date in Eastern Time.
        data_tests:
          - not_null
      - name: start_time_et
        description: Scheduled tip-off time in Eastern Time; null when unpublished.
      - name: status
        description: "Game status from the schedule: Final or Scheduled."
        data_tests:
          - not_null
      - name: home_team_id
        description: Home team (Baseline team UUID).
        data_tests:
          - not_null
      - name: away_team_id
        description: Away team (Baseline team UUID).
        data_tests:
          - not_null
