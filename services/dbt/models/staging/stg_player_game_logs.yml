version: 2

models:
  - name: stg_player_game_logs
    description: Player game logs with parsed home/away location and opponent abbreviation.
    columns:
      - name: player_id
        description: Baseline player UUID.
        data_tests:
          - not_null
      - name: game_id
        description: Baseline game UUID.
        data_tests:
          - not_null
      - name: location
        description: home or away, parsed from the matchup string (' vs. ' is home, ' @ ' is away).
        data_tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: ["home", "away"]
                quote_values: true
      - name: result
        description: W or L for the player's team.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: ["W", "L"]
                quote_values: true
      - name: points
        description: Points scored.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 200
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["player_id", "game_id"]
      # Empty between seasons (and after a prod reset): warn, don't fail the build.
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
          config:
            severity: warn
