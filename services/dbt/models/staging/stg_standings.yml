version: 2

models:
  - name: stg_standings
    description: Regular Season standings from source.standings, lightly cleaned.
    columns:
      - name: team_id
        description: Baseline team UUID.
        data_tests:
          - not_null
      - name: season
        description: NBA season label, e.g. 2025-26.
        data_tests:
          - not_null
      - name: season_type
        description: Always Regular Season; other season types are filtered out.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set: ["Regular Season"]
                quote_values: true
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: ["team_id", "season", "season_type"]
