version: 2

models:
  - name: stg_players
    description: Cleaned player biographical data from the NBA API.
    columns:
      - name: player_id
        description: Unique NBA player identifier.
        data_tests:
          - unique
          - not_null
      - name: full_name
        description: Display name for the player.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_value_lengths_to_be_between:
              arguments:
                min_value: 1
                max_value: 200
      - name: is_active
        data_tests:
          - dbt_expectations.expect_column_values_to_not_be_null
      - name: position
        description: Full position name mapped from the roster code (PG, 1, G-F, ...).
        data_tests:
          # warn, not error: a new roster code should surface, not skip every
          # model downstream of players in dbt build.
          - dbt_expectations.expect_column_values_to_be_in_set:
              arguments:
                value_set:
                  [
                    "Point Guard",
                    "Shooting Guard",
                    "Small Forward",
                    "Power Forward",
                    "Center",
                    "Guard",
                    "Forward",
                    "Guard-Forward",
                    "Forward-Guard",
                    "Forward-Center",
                    "Center-Forward",
                  ]
                quote_values: true
                row_condition: "position is not null"
              config:
                severity: warn
      - name: from_year
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1946
                max_value: 2100
                row_condition: "from_year is not null"
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
