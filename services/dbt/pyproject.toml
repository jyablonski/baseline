[project]
name = "nba-dbt"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dbt-core==1.12.3",
    "dbt-postgres==1.11.0",
]

[dependency-groups]
dev = [
    "dbt-score==0.18.0",
    "sqlfluff-templater-dbt==4.3.0",
    "sqlfluff==4.3.0",
    "ty==0.0.78",
]

[tool.uv]
package = false
default-groups = ["dev"]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.sqlfluff.core]
dialect = "postgres"
templater = "dbt"
max_line_length = 120
exclude_rules = "AM04"

[tool.sqlfluff.templater.dbt]
project_dir = "."
profiles_dir = "."

[tool.sqlfluff.indentation]
tab_space_size = 4
indent_unit = "space"

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.identifiers]
extended_capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.functions]
extended_capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.literals]
capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.types]
extended_capitalisation_policy = "lower"

[tool.sqlfluff.rules.aliasing.table]
# If a table alias slips in, require explicit AS (defense in depth with AL07).
aliasing = "explicit"

[tool.sqlfluff.rules.aliasing.column]
aliasing = "explicit"

[tool.sqlfluff.rules.aliasing.forbid]
# Forbid table aliases in FROM/JOIN; use full relation/CTE names (dbt style).
# Disabled by default for all dialects — must force-enable.
force_enable = true

[tool.sqlfluff.rules.structure.subquery]
# Prefer CTEs over derived tables in FROM/JOIN (ST05 / L042).
# Does not cover scalar subqueries in SELECT/WHERE — ban those by convention.
forbid_subquery_in = "both"

[tool.sqlfluff.rules.references.qualification]
# Prefer fully qualified CTE/table column references over short aliases.
forbid_qualified = false

[tool.sqlfluff.rules.references.keywords]
# NBA domain columns that collide with SQL keywords (e.g. LOCATION).
ignore_words = "location,result,source"

# dbt ships no Python source; this only anchors ty to this project.
[tool.ty.environment]
python-version = "3.13"

[tool.dbt-score]
# Solo project: there is no meta.owner convention to enforce.
disabled_rules = [
    "dbt_score.rules.generic.has_owner",
    "dbt_score.rules.generic.seed_has_owner",
    # Example queries belong in Cube / the API, not in every model description.
    "dbt_score.rules.generic.has_example_sql",
]
# Ratchet: just under the current project score so CI fails on regressions.
# Raise as descriptions get filled in.
fail_project_under = 9.0
fail_any_item_under = 5.0

[tool.dbt-score.rules."dbt_score.rules.generic.sql_has_reasonable_number_of_lines"]
# int_game_features and fct_game_flow are ~450 lines of CTEs by design.
max_lines = 500
