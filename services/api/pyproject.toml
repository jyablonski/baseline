[project]
name = "nba-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "baseline-analytics",
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.0.57",
    "psycopg2-binary==2.9.13",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest-cov==7.1.0",
    "pytest==9.2.0",
    "testcontainers[postgres]==4.15.0",
    "ty==0.0.92",
]

[tool.uv]
package = false

# Shared with services/mcp. Editable, so a change in lib/ needs no reinstall.
[tool.uv.sources]
baseline-analytics = { path = "../../lib/baseline-analytics", editable = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# `../..` is the repo root, for the shared `testing.postgres_tc` helpers.
pythonpath = ["src", "../.."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=90",
    "--color=yes",
]
markers = [
    "unit: Unit tests that don't require external dependencies",
    "integration: Tests that require Docker / Testcontainers Postgres",
]
# Starlette 1.6.0 TestClient still types BlockingPortal via anyio.abc (deprecated
# in anyio 4.15). FastAPI 0.141.1 / Starlette 1.6.0 are current; no upgrade path.
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated, use anyio.from_thread.BlockingPortal instead\\.:DeprecationWarning:starlette.testclient",
]

# Anchors ty to this service so it does not walk up and type-check the whole
# repo against this venv. Mirrors the `src` entry in pytest's pythonpath.
[tool.ty.environment]
extra-paths = ["src"]

# Check shipped code only: tests pass duck-typed doubles where a concrete class
# is annotated, which is intentional.
[tool.ty.src]
include = ["src"]
