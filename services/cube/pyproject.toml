[project]
name = "nba-cube"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest-cov==7.1.0",
    "pytest==9.2.0",
    "ty==0.0.92",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=90",
    "--color=yes",
]
markers = [
    "unit: Unit tests that don't require external dependencies",
]

# Anchors ty to this service so it does not walk up and type-check the whole
# repo against this venv. Mirrors pytest's pythonpath = ["src"].
[tool.ty.environment]
extra-paths = ["src"]

# Check shipped code only: tests pass duck-typed doubles where a concrete class
# is annotated, which is intentional.
[tool.ty.src]
include = ["src"]
