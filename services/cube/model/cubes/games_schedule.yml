cubes:
  - name: games_schedule
    sql_table: gold.fct_games_schedule
    description: All-status slate (Final and upcoming). Upcoming scores are null. Do not use as a completed-game fact.

    dimensions:
      - name: game_id
        sql: game_id
        type: string
        primary_key: true
        public: true

      - name: season
        sql: season
        type: string

      - name: season_type
        sql: season_type
        type: string

      - name: game_date
        sql: game_date
        type: time

      - name: status
        sql: status
        type: string

      - name: national_tv
        sql: national_tv
        type: string
        description: National TV and streaming networks from ESPN, comma-separated (e.g. "ESPN, ABC"). Null for a local-only game or one not listed yet.

      - name: arena
        sql: arena
        type: string

      - name: arena_city
        sql: arena_city
        type: string

      - name: arena_state
        sql: arena_state
        type: string

      - name: home_team_id
        sql: home_team_id
        type: string

      - name: home_team
        sql: home_team_abbreviation
        type: string

      - name: home_team_name
        sql: home_team_name
        type: string

      - name: home_score
        sql: home_score
        type: number

      - name: away_team_id
        sql: away_team_id
        type: string

      - name: away_team
        sql: away_team_abbreviation
        type: string

      - name: away_team_name
        sql: away_team_name
        type: string

      - name: away_score
        sql: away_score
        type: number

    measures:
      - name: count
        type: count
