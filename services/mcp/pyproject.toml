[project]
name = "nba-mcp"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastmcp==4.0.2",
    "python-dotenv==1.2.3",
    "pydantic-settings==2.15.0",
]

[dependency-groups]
dev = [
    "pytest-cov==7.1.0",
    "pytest==9.1.1",
    "testcontainers[postgres]==4.15.0",
    "ty==0.0.78",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=90",
    "--color=yes",
]
markers = [
    "unit: Unit tests that don't require external dependencies",
    "integration: Tests that require Docker / Testcontainers Postgres",
]

# Anchors ty to this service so it does not walk up and type-check the whole
# repo against this venv. Mirrors pytest's pythonpath = ["src"].
# The `# ty: ignore` in src/server.py is fastmcp typing its transport as a
# Literal union while we pass a validated str.
[tool.ty.environment]
extra-paths = ["src"]

# Check shipped code only: tests pass duck-typed doubles where a concrete class
# is annotated, which is intentional.
[tool.ty.src]
include = ["src"]
